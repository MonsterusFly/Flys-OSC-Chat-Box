name: Fedora RPM
on:
  push:
    branches: [main]
    tags: ['v1.2.*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-rpm:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install build tools
        run: dnf install -y git rpm-build python3 python3-pytest python3-psutil python3-pillow python3-pyside6
      - uses: actions/checkout@v4
      - name: Check Python syntax
        run: python3 -m compileall -q main.py core ui integrations packaging/uninstall_gui.py
      - name: Build RPM
        run: bash scripts/build_rpm.sh
      - name: Inspect RPM metadata and contents
        run: |
          rpmfile=$(find dist -type f -name 'flys-osc-chat-box-*.rpm' -print -quit)
          test -n "$rpmfile"
          rpm -qpi "$rpmfile"
          rpm -qpl "$rpmfile" | grep '/usr/bin/flys-osc-chat-box'
          rpm -qpl "$rpmfile" | grep '/usr/share/applications/flys-osc-chat-box-uninstall.desktop'
      - uses: actions/upload-artifact@v4
        with:
          name: fedora-rpm
          path: dist/**/*.rpm
      - name: Attach RPM to GitHub release
        if: startsWith(github.ref, 'refs/tags/v1.2.')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*.rpm
