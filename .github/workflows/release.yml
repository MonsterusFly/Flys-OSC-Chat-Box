name: Release source installer
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest
      - run: QT_QPA_PLATFORM=offscreen python -m pytest -q
      - name: Build release archives
        run: |
          python scripts/package_release.py "${GITHUB_REF_NAME}"
          (cd dist && sha256sum *.tar.gz *.zip > SHA256SUMS)
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
