name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m compileall -q main.py core ui integrations
      - run: QT_QPA_PLATFORM=offscreen python -m pytest -q
